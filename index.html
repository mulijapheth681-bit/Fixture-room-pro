<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture Room Pro</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#080a12;color:#eee}.h{background:#0f1220;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:9;border-bottom:1px solid #222}.btn{background:#1f6feb;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.c{max-width:700px;margin:auto;padding:12px}.card{background:#121625;border:1px solid #222;border-radius:16px;padding:14px;margin:10px 0}.tab{flex:1;padding:10px;text-align:center;background:#121625;border-radius:12px;color:#777;font-weight:800;font-size:11px;cursor:pointer}.tab.a{background:#fff;color:#000}.tabs{display:flex;gap:6px}.f{background:#0e121d;border:1px solid #222;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}table{width:100%;border-collapse:collapse}th{color:#666;font-size:10px;padding:8px;border-bottom:1px solid #222}td{padding:10px 4px;border-bottom:1px solid #222;text-align:center;font-size:13px}td:nth-child(2){text-align:left;font-weight:700}.in{width:100%;background:#0e121d;border:1px solid #222;border-radius:10px;padding:10px;color:#fff;margin:4px 0}.hidden{display:none!important}#log{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99}#log.s{display:flex}.pot{font-size:26px;font-weight:900;color:#00ff88}.badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800}.paid{background:#00ff8822;color:#00ff88;border:1px solid #00ff88}.nopaid{background:#ff444422;color:#ff4444;border:1px solid #ff4444}</style></head><body>
<div class="h"><b>FIXTURE ROOM PRO</b><div><span id="st" style="background:#333;padding:4px 8px;border-radius:20px;font-size:11px">LIVE</span> <button class="btn" style="padding:6px 10px" onclick="openA()">Admin</button></div></div>
<div class="c">
<div class="card" style="text-align:center;background:radial-gradient(circle at top,#1c2135,#0f1220);border-color:#c0c0c0"><div style="font-size:38px">🥈 💰</div><div id="champ" style="font-weight:900;font-size:18px;margin-top:6px">Season Ongoing</div><div style="margin-top:8px;background:#0e121d;border-radius:12px;padding:10px"><div style="font-size:11px;color:#888">TOTAL POT - 50 EACH x 7</div><div class="pot" id="potTotal">KSH 0</div><div style="font-size:11px;color:#888" id="potInfo">0 / 7 paid</div></div></div>
<div class="tabs"><div class="tab a" id="tF" onclick="sw('f')">Fixtures</div><div class="tab" id="tT" onclick="sw('t')">Table</div><div class="tab" id="tP" onclick="sw('p')">Pot 💰</div></div>
<div id="vF"><div id="fl"></div></div>
<div id="vT" class="hidden"><div class="card"><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<div id="vP" class="hidden"><div class="card"><h3>💰 Winner Pot - KSH 50 Each</h3><p style="font-size:11px;color:#888">7 teams = Winner takes KSH 350!</p><table><thead><tr><th>#</th><th>Team</th><th>Amt</th><th>Status</th></tr></thead><tbody id="potTb"></tbody></table><div style="margin-top:12px;background:#0e121d;padding:12px;border-radius:12px;text-align:center"><div style="font-size:11px;color:#888">WINNER PRIZE</div><div class="pot" id="prize">KSH 0</div></div></div></div>
<div id="ap" class="hidden"><div class="card" style="border-color:#1f6feb"><h3>Admin Panel</h3><div class="tabs" style="margin:8px 0"><div class="tab a" id="aF" onclick="swA('f')">Score</div><div class="tab" id="aP" onclick="swA('p')">Pot</div></div><div id="aFv"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="rA" class="in"></select><select id="rB" class="in"></select></div><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px"><input id="sA" type="number" class="in" style="font-size:22px;text-align:center" placeholder="0"><b>VS</b><input id="sB" type="number" class="in" style="font-size:22px;text-align:center" placeholder="0"></div><button class="btn" style="width:100%;margin-top:10px;background:#c0c0c0;color:#000" onclick="saveR()">💾 SAVE SCORE</button></div><div id="aPv" class="hidden"><select id="pTeam" class="in"></select><input id="pAmt" type="number" class="in" value="50"><select id="pStat" class="in"><option value="paid">✅ Paid</option><option value="not">❌ Not Paid</option></select><button class="btn" style="width:100%;margin-top:8px;background:#00ff88;color:#000" onclick="savePot()">💰 SAVE</button></div><p id="msg" style="font-size:12px;margin-top:10px;color:#00ff88"></p></div></div>
</div>
<div id="log"><div class="card" style="width:90%;max-width:300px"><h3>Admin Login</h3><input id="pw" type="password" class="in" placeholder="Password"><button class="btn" style="width:100%;margin-top:8px" onclick="login()">Unlock</button><button class="btn" style="width:100%;margin-top:6px;background:#333" onclick="closeA()">Cancel</button></div></div>
<script>
const BIN_ID="54d32c0d9ebb25252fa2";const API="https://api.npoint.io/"+BIN_ID;
const T=["Reformedbandic","Targeter","Junior","Asmicardo","Gamefir","Kazi_ni_kupigwa","Drazen"];
const fx=[{h:"Reformedbandic",a:"Targeter",d:"Sep 29"},{h:"Junior",a:"Asmicardo",d:"Sep 29"},{h:"Gamefir",a:"Kazi_ni_kupigwa",d:"Sep 30"},{h:"Reformedbandic",a:"Junior",d:"Sep 30"},{h:"Targeter",a:"Gamefir",d:"Oct 1"},{h:"Asmicardo",a:"Kazi_ni_kupigwa",d:"Oct 1"},{h:"Reformedbandic",a:"Asmicardo",d:"Oct 2"},{h:"Targeter",a:"Kazi_ni_kupigwa",d:"Oct 2"},{h:"Junior",a:"Gamefir",d:"Oct 3"},{h:"Reformedbandic",a:"Gamefir",d:"Oct 3"},{h:"Targeter",a:"Asmicardo",d:"Oct 4"},{h:"Junior",a:"Kazi_ni_kupigwa",d:"Oct 4"},{h:"Reformedbandic",a:"Kazi_ni_kupigwa",d:"Oct 5"},{h:"Targeter",a:"Junior",d:"Oct 5"},{h:"Asmicardo",a:"Gamefir",d:"Oct 6"},{h:"Drazen",a:"Reformedbandic",d:"Oct 7"},{h:"Drazen",a:"Targeter",d:"Oct 7"},{h:"Drazen",a:"Junior",d:"Oct 8"},{h:"Drazen",a:"Asmicardo",d:"Oct 8"},{h:"Drazen",a:"Gamefir",d:"Oct 9"},{h:"Drazen",a:"Kazi_ni_kupigwa",d:"Oct 9"}];
let rs=[],pot=[];
async function loadR(){try{let r=await fetch(API);let d=await r.json();if(Array.isArray(d)){rs=d;pot=T.map(t=>({team:t,amt:50,stat:"not"}))}else{rs=d.results||[];pot=d.pot||T.map(t=>({team:t,amt:50,stat:"not"}));if(pot.length<7){T.forEach(t=>{if(!pot.find(p=>p.team==t))pot.push({team:t,amt:50,stat:"not"})})}}document.getElementById('st').textContent='LIVE ✓';document.getElementById('st').style.background='#0a7a00';render()}catch(e){rs=[];pot=T.map(t=>({team:t,amt:50,stat:"not"}));render()}}
async function saveAll(){let data={results:rs,pot:pot};document.getElementById('msg').textContent='Publishing...';try{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.getElementById('msg').textContent='✅ Published!';}catch(e){document.getElementById('msg').textContent='Failed'}}
async function saveR(){let h=document.getElementById('rA').value,a=document.getElementById('rB').value,sa=document.getElementById('sA').value,sb=document.getElementById('sB').value;if(h==a)return alert('Pick different');if(sa===''||sb==='')return alert('Enter scores');let nr={h,a,sa:parseInt(sa),sb:parseInt(sb)};let ex=rs.findIndex(x=>x.h==h&&x.a==a);if(ex>=0)rs[ex]=nr;else rs.push(nr);await saveAll();render()}
async function savePot(){let team=document.getElementById('pTeam').value,amt=parseInt(document.getElementById('pAmt').value)||50,stat=document.getElementById('pStat').value;let ex=pot.findIndex(x=>x.team==team);if(ex>=0)pot[ex]={team,amt,stat};else pot.push({team,amt,stat});await saveAll();render()}
function tbl(){let m=T.map(t=>({t,p:0,w:0,d:0,l:0,pts:0}));rs.forEach(r=>{let H=m.find(x=>x.t==r.h),A=m.find(x=>x.t==r.a);if(!H||!A)return;H.p++;A.p++;if(r.sa>r.sb){H.w++;H.pts+=3;A.l++}else if(r.sa<r.sb){A.w++;A.pts+=3;H.l++}else{H.d++;A.d++;H.pts++;A.pts++}});return m}
function sw(x){document.getElementById('tF').classList.toggle('a',x=='f');document.getElementById('tT').classList.toggle('a',x=='t');document.getElementById('tP').classList.toggle('a',x=='p');document.getElementById('vF').classList.toggle('hidden',x!='f');document.getElementById('vT').classList.toggle('hidden',x!='t');document.getElementById('vP').classList.toggle('hidden',x!='p')}
function swA(x){document.getElementById('aF').classList.toggle('a',x=='f');document.getElementById('aP').classList.toggle('a',x=='p');document.getElementById('aFv').classList.toggle('hidden',x!='f');document.getElementById('aPv').classList.toggle('hidden',x!='p')}
function render(){let fl=document.getElementById('fl'),tb=document.getElementById('tb'),potTb=document.getElementById('potTb');fl.innerHTML='';fx.forEach(f=>{let p=rs.find(r=>r.h==f.h&&r.a==f.a);let sc=p?`<b style="background:#c0c0c0;color:#000;padding:4px 10px;border-radius:20px;font-size:12px">${p.sa}-${p.sb}</b>`:`<span style="color:#555;font-size:11px">${f.d}</span>`;fl.innerHTML+=`<div class="f"><div><div style="font-weight:700">${f.h} <span style="color:#555">vs</span> ${f.a}</div><div style="font-size:11px;color:#666">${f.d}</div></div><div>${sc}</div></div>`});let t=tbl().sort((a,b)=>b.pts-a.pts);tb.innerHTML='';t.forEach((r,i)=>{tb.innerHTML+=`<tr><td>${i+1}</td><td>${i==0&&r.pts>0?'👑 ':''}${r.t}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td style="font-weight:900">${r.pts}</td></tr>`});if(t[0]&&t[0].pts>0)document.getElementById('champ').textContent='👑 '+t[0].t+' - '+t[0].pts+' PTS';let total=0,paid=0;potTb.innerHTML='';pot.forEach((p,i)=>{let isPaid=p.stat=='paid';if(isPaid){total+=p.amt;paid++}potTb.innerHTML+=`<tr><td>${i+1}</td><td>${p.team}</td><td>KSH ${p.amt}</td><td><span class="badge ${isPaid?'paid':'nopaid'}">${isPaid?'PAID':'NOT PAID'}</span></td></tr>`});document.getElementById('potTotal').textContent='KSH '+total;document.getElementById('prize').textContent='KSH '+total;document.getElementById('potInfo').textContent=paid+' / '+T.length+' paid • KSH '+total+' collected';}
let admin=false;function openA(){if(admin){document.getElementById('ap').classList.remove('hidden');return}document.getElementById('log').classList.add('s')}function closeA(){document.getElementById('log').classList.remove('s')}function login(){if(atob('SmFwaGV0aEAyMDI2')==document.getElementById('pw').value.trim()){admin=true;closeA();document.getElementById('ap').classList.remove('hidden');window.scrollTo(0,document.body.scrollHeight)}else alert('Wrong')}
function initSel(){let rA=document.getElementById('rA'),rB=document.getElementById('rB'),pT=document.getElementById('pTeam');T.forEach(t=>{rA.innerHTML+=`<option>${t}</option>`;rB.innerHTML+=`<option>${t}</option>`;pT.innerHTML+=`<option>${t}</option>`});rB.selectedIndex=1}initSel();loadR();setInterval(loadR,10000);
</script></body></html>

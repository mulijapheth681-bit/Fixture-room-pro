<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football League Manager</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #123c2b;
      color: white;
      padding: 25px 8%;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #c9e7d4; }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000b;
      overflow-x: auto;
    }

    h2 { margin-top: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      padding: 12px 10px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    th { background: #edf5ef; }
    td:nth-child(2), th:nth-child(2) {
      text-align: left;
    }

    input {
      width: 55px;
      padding: 8px;
      text-align: center;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background: #176b43;
      color: white;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: #105332; }

    .points { font-weight: bold; color: #176b43; }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ Football League Manager</h1>
  <p>Manage fixtures. Record scores. Track the league.</p>
</header>

<main>
  <section class="card">
    <h2>🏆 League Standings</h2>

    <table>
      <thead>
        <tr>
          <th>Pos</th><th>Team</th><th>MP</th>
          <th>W</th><th>D</th><th>L</th>
          <th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
        </tr>
      </thead>
      <tbody id="standings"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>📅 Match Fixtures & Results</h2>
    <p>Enter the home and away scores. Standings update automatically.</p>

    <table>
      <thead>
        <tr>
          <th>Round</th><th>Home Team</th>
          <th>Score</th><th>Away Team</th>
        </tr>
      </thead>
      <tbody id="fixtures"></tbody>
    </table>
  </section>
</main>

<footer>Football League Manager © 2026</footer>

<script>
  // Our sample teams
  const teams = ["Arsenal", "Chelsea", "Liverpool", "Man City"];

  // Each match has a round, two teams, and scores
  const matches = [
    { round: 1, home: "Arsenal", away: "Chelsea", hs: "", as: "" },
    { round: 1, home: "Liverpool", away: "Man City", hs: "", as: "" },
    { round: 2, home: "Arsenal", away: "Liverpool", hs: "", as: "" },
    { round: 2, home: "Chelsea", away: "Man City", hs: "", as: "" },
    { round: 3, home: "Man City", away: "Arsenal", hs: "", as: "" },
    { round: 3, home: "Chelsea", away: "Liverpool", hs: "", as: "" }
  ];

  // Display all fixtures
  function showFixtures() {
    const table = document.getElementById("fixtures");

    table.innerHTML = matches.map((m, i) => `
      <tr>
        <td>${m.round}</td>
        <td>${m.home}</td>
        <td>
          <input type="number" min="0" step="1"
            value="${m.hs}" aria-label="Home goals"
            onchange="updateScore(${i}, 'hs', this.value)">
          -
          <input type="number" min="0" step="1"
            value="${m.as}" aria-label="Away goals"
            onchange="updateScore(${i}, 'as', this.value)">
        </td>
        <td>${m.away}</td>
      </tr>
    `).join("");
  }

  // Save a score and refresh the table
  function updateScore(index, side, value) {
    if (value !== "" &&
        (!Number.isInteger(Number(value)) || Number(value) < 0)) {
      alert("Enter a whole number, 0 or higher.");
      showFixtures();
      return;
    }

    matches[index][side] = value;
    showStandings();
  }

  // Calculate league statistics from completed matches
  function showStandings() {
    const stats = {};

    teams.forEach(team => {
      stats[team] = {
        mp: 0, w: 0, d: 0, l: 0,
        gf: 0, ga: 0, pts: 0
      };
    });

    matches.forEach(m => {
      // Ignore matches without both scores
      if (m.hs === "" || m.as === "") return;

      const h = Number(m.hs);
      const a = Number(m.as);

      const home = stats[m.home];
      const away = stats[m.away];

      home.mp++;
      away.mp++;

      home.gf += h;
      home.ga += a;
      away.gf += a;
      away.ga += h;

      if (h > a) {
        home.w++;
        home.pts += 3;
        away.l++;
      } else if (h < a) {
        away.w++;
        away.pts += 3;
        home.l++;
      } else {
        home.d++;
        away.d++;
        home.pts++;
        away.pts++;
      }
    });

    // Sort by points, goal difference, then goals scored
    const sorted = teams.slice().sort((a, b) =>
      stats[b].pts - stats[a].pts ||
      (stats[b].gf - stats[b].ga) -
      (stats[a].gf - stats[a].ga) ||
      stats[b].gf - stats[a].gf
    );

    document.getElementById("standings").innerHTML =
      sorted.map((team, i) => {
        const s = stats[team];
        const gd = s.gf - s.ga;

        return `
          <tr>
            <td>${i + 1}</td>
            <td><strong>${team}</strong></td>
            <td>${s.mp}</td><td>${s.w}</td>
            <td>${s.d}</td><td>${s.l}</td>
            <td>${s.gf}</td><td>${s.ga}</td>
            <td>${gd > 0 ? "+" : ""}${gd}</td>
            <td class="points">${s.pts}</td>
          </tr>
        `;
      }).join("");
  }

  // Start the application
  showFixtures();
  showStandings();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier League - Fixture Room</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0f1115;color:#e6e6e6;min-height:100vh}
.header{background:#161a22;border-bottom:1px solid #232836;padding:14px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:16px;font-weight:800;letter-spacing:.5px}
.badge{font-size:11px;background:#1f6feb;color:#fff;padding:4px 8px;border-radius:20px}
.btn{background:#1f6feb;color:#fff;border:0;padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer;width:100%}
.btn-small{padding:6px 10px;font-size:12px;width:auto}
.btn-ghost{background:#21262d;color:#c9d1d9}
.container{max-width:800px;margin:0 auto;padding:14px}
.card{background:#161a22;border:1px solid #232836;border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;justify-content:space-between}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:11px;text-align:center;background:#161a22;border:1px solid #232836;border-radius:12px;cursor:pointer;font-weight:700;color:#8b949e;font-size:13px}
.tab.active{background:#fff;color:#000;border-color:#fff}
.fixture{display:flex;justify-content:space-between;align-items:center;background:#0d1117;border:1px solid #21262d;border-radius:14px;padding:14px;margin:10px 0}
.teams{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.vs{width:28px;height:28px;background:#21262d;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8b949e}
.meta{font-size:11px;color:#8b949e;margin-top:4px}
.input,select{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:12px;color:#fff;margin:6px 0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#8b949e;text-align:center;padding:10px 4px;border-bottom:1px solid #232836;font-size:11px}
th:first-child,th:nth-child(2){text-align:left}
td{padding:12px 4px;border-bottom:1px solid #1a1e27;text-align:center}
td:nth-child(2){text-align:left;font-weight:700}
.team-row{display:flex;align-items:center;gap:8px}
.num{width:22px;text-align:center;font-size:12px;color:#8b949e}
.hidden{display:none}
.badge-live{background:#238636}
</style>
</head>
<body>
<div class="header">
<h1>⚽ PREMIER LEAGUE</h1>
<div style="display:flex;gap:8px;align-items:center">
<span class="badge" id="modeBadge">VIEW ONLY</span>
<button class="btn btn-small" onclick="openAdmin()">Admin</button>
</div>
</div>
<div class="container">
<div class="tabs">
<div class="tab active" id="tabF" onclick="switchTab('fixtures')">Fixtures</div>
<div class="tab" id="tabT" onclick="switchTab('table')">🏆 Table</div>
</div>
<div id="viewFixtures">
<div class="card"><h3>Matchday Fixtures - Who Plays Who</h3><div id="fixtureList"></div></div>
<div class="card" style="background:#0d1117;border-style:dashed"><h3>6 Teams In League</h3><div id="teamChips" style="display:flex;flex-wrap:wrap;gap:8px"></div></div>
</div>
<div id="viewTable" class="hidden">
<div class="card">
<h3>Premier League Table</h3>
<table>
<thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>
<div id="adminPanel" class="hidden">
<div class="card" style="border-color:#1f6feb">
<h3>Create Fixture From Your 6 Teams</h3>
<div class="grid2">
<select id="selA"></select>
<select id="selB"></select>
</div>
<div class="grid2"><input class="input" id="fDate" type="date"><input class="input" id="fTime" type="time"></div>
<input class="input" id="fVenue" placeholder="Venue (optional)">
<button class="btn" style="margin-top:8px" onclick="addFixture()">+ Add Match</button>
</div>
<div class="card"><h3>Manage Fixtures</h3><div id="adminList"></div></div>
<div class="card" style="border-color:#238636">
<h3>🏆 Update Points - Premier League Table</h3>
<select id="rankSel"></select>
<div class="grid2"><input class="input" id="rP" type="number" placeholder="Played"><input class="input" id="rW" type="number" placeholder="Won"></div>
<div class="grid2"><input class="input" id="rD" type="number" placeholder="Draw"><input class="input" id="rL" type="number" placeholder="Lost"><input class="input" id="rPts" type="number" placeholder="Points"></div>
<button class="btn" style="margin-top:8px;background:#238636" onclick="saveRank()">💾 Save Points</button>
</div>
<button class="btn btn-ghost" onclick="logout()">Exit Admin Mode</button>
<div style="height:80px"></div>
</div>
</div>
<div id="loginModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:20">
<div class="card" style="width:90%;max-width:340px"><h3>Admin Login</h3><input class="input" id="pass" type="password" placeholder="Password"><button class="btn" style="margin-top:10px" onclick="login()">Login</button><button class="btn btn-ghost" style="margin-top:8px" onclick="closeAdmin()">Cancel</button><p style="font-size:11px;color:#8b949e;text-align:center;margin-top:8px">Default: admin123</p></div>
</div>
<script>
const TEAMS=["Reformedbandic","Targeter","Junior","Asmicardo","Drayzen","Nohope"];
const ADMIN_PASS="admin123";
let defaultFixtures=[
{home:"Reformedbandic",away:"Targeter",date:"2026-09-29",time:"15:00",venue:"Main Ground"},
{home:"Junior",away:"Asmicardo",date:"2026-09-29",time:"16:30",venue:"Main Ground"},
{home:"Drayzen",away:"Nohope",date:"2026-09-30",time:"15:00",venue:"Main Ground"},
{home:"Targeter",away:"Junior",date:"2026-10-01",time:"15:00",venue:"Main Ground"},
{home:"Asmicardo",away:"Drayzen",date:"2026-10-01",time:"16:30",venue:"Main Ground"}
];
let defaultTable=TEAMS.map(t=>({team:t,p:0,w:0,d:0,l:0,pts:0}));
defaultTable[0]={team:"Reformedbandic",p:2,w:2,d:0,l:0,pts:6};
defaultTable[1]={team:"Junior",p:2,w:1,d:1,l:0,pts:4};
defaultTable[2]={team:"Targeter",p:2,w:1,d:0,l:1,pts:3};
defaultTable[3]={team:"Asmicardo",p:2,w:0,d:1,l:1,pts:1};
defaultTable[4]={team:"Drayzen",p:2,w:0,d:0,l:2,pts:0};
defaultTable[5]={team:"Nohope",p:2,w:0,d:0,l:2,pts:0};

let fixtures=JSON.parse(localStorage.getItem('pl_fixtures')||'null')||defaultFixtures;
let table=JSON.parse(localStorage.getItem('pl_table')||'null')||defaultTable;
let isAdmin=false;let cur='fixtures';

function initSelects(){
  const a=document.getElementById('selA'),b=document.getElementById('selB'),r=document.getElementById('rankSel');
  a.innerHTML='';b.innerHTML='';r.innerHTML='';
  TEAMS.forEach(t=>{a.innerHTML+=`<option>${t}</option>`;b.innerHTML+=`<option>${t}</option>`;r.innerHTML+=`<option>${t}</option>`});
  b.selectedIndex=1;
}
function renderTeams(){
  const c=document.getElementById('teamChips');c.innerHTML='';
  TEAMS.forEach(t=>{c.innerHTML+=`<span style="background:#21262d;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600">${t}</span>`});
}
function switchTab(t){cur=t;document.getElementById('tabF').classList.toggle('active',t==='fixtures');document.getElementById('tabT').classList.toggle('active',t==='table');document.getElementById('viewFixtures').classList.toggle('hidden',t!=='fixtures');document.getElementById('viewTable').classList.toggle('hidden',t!=='table');}
function render(){
  const list=document.getElementById('fixtureList');const alist=document.getElementById('adminList');list.innerHTML='';alist.innerHTML='';
  fixtures.forEach((f,i)=>{
    const div=document.createElement('div');div.className='fixture';
    div.innerHTML=`<div><div class="teams"><span>${f.home}</span><span class="vs">vs</span><span>${f.away}</span></div><div class="meta">📅 ${f.date} ⏰ ${f.time} ${f.venue?'• '+f.venue:''}</div></div>`;
    list.appendChild(div);
    const ad=document.createElement('div');ad.className='fixture';ad.innerHTML=`<div class="teams" style="font-size:13px"><span>${f.home}</span><span class="vs">vs</span><span>${f.away}</span></div><button class="btn btn-small btn-ghost" onclick="delF(${i})">Delete</button>`;
    alist.appendChild(ad);
  });
  localStorage.setItem('pl_fixtures',JSON.stringify(fixtures));
  renderTable();
}
function renderTable(){
  table.sort((a,b)=>b.pts-a.pts);
  const tb=document.getElementById('tableBody');tb.innerHTML='';
  table.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><span class="num">${i+1}</span></td><td><div class="team-row">${r.team}</div></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td style="font-weight:800;color:#58a6ff">${r.pts}</td>`;
    if(i<2)tr.style.background='rgba(35,134,54,0.1)';
    tb.appendChild(tr);
  });
  localStorage.setItem('pl_table',JSON.stringify(table));
}
function openAdmin(){if(isAdmin){showAdmin();return}document.getElementById('loginModal').classList.remove('hidden');document.getElementById('loginModal').style.display='flex';}
function closeAdmin(){document.getElementById('loginModal').classList.add('hidden');}
function showAdmin(){document.getElementById('viewFixtures').classList.remove('hidden');document.getElementById('viewTable').classList.remove('hidden');document.getElementById('adminPanel').classList.remove('hidden');document.getElementById('modeBadge').textContent='ADMIN MODE';document.getElementById('modeBadge').style.background='#238636';}
function login(){if(document.getElementById('pass').value===ADMIN_PASS){isAdmin=true;closeAdmin();showAdmin();document.getElementById('pass').value='';}else alert('Wrong! admin123');}
function logout(){isAdmin=false;document.getElementById('adminPanel').classList.add('hidden');switchTab(cur);document.getElementById('modeBadge').textContent='VIEW ONLY';document.getElementById('modeBadge').style.background='#1f6feb';}
function addFixture(){
  const home=document.getElementById('selA').value,away=document.getElementById('selB').value;
  if(home===away){alert('Pick 2 different teams!');return}
  fixtures.push({home,away,date:document.getElementById('fDate').value||'2026-10-02',time:document.getElementById('fTime').value||'15:00',venue:document.getElementById('fVenue').value});
  render();
}
function delF(i){if(confirm('Delete this match?')){fixtures.splice(i,1);render();}}
function saveRank(){
  const team=document.getElementById('rankSel').value;
  const idx=table.findIndex(x=>x.team===team);
  table[idx]={team,p:parseInt(document.getElementById('rP').value)||0,w:parseInt(document.getElementById('rW').value)||0,d:parseInt(document.getElementById('rD').value)||0,l:parseInt(document.getElementById('rL').value)||0,pts:parseInt(document.getElementById('rPts').value)||0};
  renderTable();
  alert(team+' updated!');
}
initSelects();renderTeams();render();
</script>
</body>
</html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture Room - Auto Public</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#080a12;color:#eee}.h{background:#0f1220;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:9;border-bottom:1px solid #222}.btn{background:#1f6feb;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.c{max-width:700px;margin:auto;padding:12px}.card{background:#121625;border:1px solid #222;border-radius:16px;padding:14px;margin:10px 0}.tab{flex:1;padding:12px;text-align:center;background:#121625;border-radius:12px;color:#777;font-weight:800;cursor:pointer}.tab.a{background:#fff;color:#000}.tabs{display:flex;gap:8px}.f{background:#0e121d;border:1px solid #222;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}table{width:100%;border-collapse:collapse}th{color:#666;font-size:10px;padding:8px;border-bottom:1px solid #222;text-align:center}td{padding:10px 4px;border-bottom:1px solid #222;text-align:center;font-size:13px}td:nth-child(2){text-align:left;font-weight:700}.in{width:100%;background:#0e121d;border:1px solid #222;border-radius:10px;padding:10px;color:#fff;margin:4px 0}.hidden{display:none!important}#log{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99}#log.s{display:flex}.live{font-size:10px;background:#0a7a00;color:#fff;padding:3px 8px;border-radius:20px}</style></head><body>
<div class="h"><b>FIXTURE ROOM PRO</b><div><span id="st" style="background:#333;padding:4px 8px;border-radius:20px;font-size:11px">CONNECTING...</span> <button class="btn" style="padding:6px 10px" onclick="openA()">Admin</button></div></div>
<div class="c">
<div class="card" style="text-align:center;background:radial-gradient(circle at top,#1c2135,#0f1220);border-color:#c0c0c0"><div style="font-size:54px">🥈</div><div style="font-size:10px;letter-spacing:2px;color:#c0c0c0">SILVER EDITION - AUTO PUBLIC</div><div id="champ" style="font-weight:900;font-size:20px;margin-top:6px">Season Ongoing</div><div style="font-size:11px;color:#888">Updates everywhere instantly!</div></div>
<div class="tabs"><div class="tab a" id="tF" onclick="sw('f')">Fixtures</div><div class="tab" id="tT" onclick="sw('t')">Table</div></div>
<div id="vF"><div id="fl"></div></div>
<div id="vT" class="hidden"><div class="card"><h3 style="font-size:12px;color:#888;margin-bottom:8px">LIVE TABLE - Friends see same <span class="live">AUTO</span></h3><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<div id="ap" class="hidden"><div class="card" style="border-color:#1f6feb"><h3>Update Result (Public for ALL)</h3><p style="font-size:11px;color:#888;margin:6px 0">Enter score → Save → Friends see instantly, no GitHub needed!</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="rA" class="in"></select><select id="rB" class="in"></select></div><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px"><input id="sA" type="number" class="in" style="font-size:22px;text-align:center" placeholder="0"><b>VS</b><input id="sB" type="number" class="in" style="font-size:22px;text-align:center" placeholder="0"></div><button class="btn" style="width:100%;margin-top:10px;background:#c0c0c0;color:#000;font-weight:900" onclick="saveR()">💾 SAVE & PUBLISH TO EVERYONE</button><p id="msg" style="font-size:12px;margin-top:10px;font-weight:700"></p></div></div>
</div>
<div id="log"><div class="card" style="width:90%;max-width:300px"><h3>Admin</h3><input id="pw" type="password" class="in" placeholder="Password"><button class="btn" style="width:100%;margin-top:8px" onclick="login()">Unlock</button><button class="btn" style="width:100%;margin-top:6px;background:#333" onclick="closeA()">Cancel</button></div></div>
<script>
const BIN_ID = "54d32c0d9ebb25252fa2";
const API = "https://api.npoint.io/"+BIN_ID;
const T=["Reformedbandic","Targeter","Junior","Asmicardo","Drayzen","Nohope"];
const fx=[{h:"Reformedbandic",a:"Targeter",d:"Sep 29"},{h:"Junior",a:"Asmicardo",d:"Sep 29"},{h:"Drayzen",a:"Nohope",d:"Sep 30"},{h:"Reformedbandic",a:"Junior",d:"Sep 30"},{h:"Targeter",a:"Drayzen",d:"Oct 1"},{h:"Asmicardo",a:"Nohope",d:"Oct 1"},{h:"Reformedbandic",a:"Asmicardo",d:"Oct 2"},{h:"Targeter",a:"Nohope",d:"Oct 2"},{h:"Junior",a:"Drayzen",d:"Oct 3"},{h:"Reformedbandic",a:"Drayzen",d:"Oct 3"},{h:"Targeter",a:"Asmicardo",d:"Oct 4"},{h:"Junior",a:"Nohope",d:"Oct 4"},{h:"Reformedbandic",a:"Nohope",d:"Oct 5"},{h:"Targeter",a:"Junior",d:"Oct 5"},{h:"Asmicardo",a:"Drayzen",d:"Oct 6"}];
let rs=[];
async function loadR(){try{let r=await fetch(API);let data=await r.json();rs=Array.isArray(data)?data:[];document.getElementById('st').textContent='LIVE ✓';document.getElementById('st').style.background='#0a7a00';render()}catch(e){document.getElementById('st').textContent='ERROR - Check bin';rs=[];render()}}
async function saveR(){let h=document.getElementById('rA').value,a=document.getElementById('rB').value,sa=document.getElementById('sA').value,sb=document.getElementById('sB').value;if(h==a)return alert('Different teams!');if(sa===''||sb==='')return alert('Enter scores');let nr={h,a,sa:parseInt(sa),sb:parseInt(sb)};let ex=rs.findIndex(x=>x.h==h&&x.a==a);if(ex>=0)rs[ex]=nr;else rs.push(nr);document.getElementById('msg').style.color='#ffcc00';document.getElementById('msg').textContent='⏳ Publishing to friends...';try{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rs)});document.getElementById('msg').style.color='#00ff88';document.getElementById('msg').textContent='✅ Published! Everyone sees new table now!';render();}catch(e){document.getElementById('msg').style.color='#ff4444';document.getElementById('msg').textContent='❌ Failed - check internet'}}
function tbl(){let m=T.map(t=>({t,p:0,w:0,d:0,l:0,pts:0}));rs.forEach(r=>{let H=m.find(x=>x.t==r.h),A=m.find(x=>x.t==r.a);if(!H||!A)return;H.p++;A.p++;if(r.sa>r.sb){H.w++;H.pts+=3;A.l++}else if(r.sa<r.sb){A.w++;A.pts+=3;H.l++}else{H.d++;A.d++;H.pts++;A.pts++}});return m}
function sw(x){document.getElementById('tF').classList.toggle('a',x=='f');document.getElementById('tT').classList.toggle('a',x=='t');document.getElementById('vF').classList.toggle('hidden',x!='f');document.getElementById('vT').classList.toggle('hidden',x!='t')}
function render(){let fl=document.getElementById('fl'),tb=document.getElementById('tb');fl.innerHTML='';fx.forEach(f=>{let p=rs.find(r=>r.h==f.h&&r.a==f.a);let sc=p?`<b style="background:#c0c0c0;color:#000;padding:4px 10px;border-radius:20px;font-size:12px">${p.sa}-${p.sb}</b>`:`<span style="color:#555;font-size:11px">${f.d}</span>`;fl.innerHTML+=`<div class="f"><div><div style="font-weight:700">${f.h} <span style="color:#555">vs</span> ${f.a}</div><div style="font-size:11px;color:#666">${f.d}</div></div><div>${sc}</div></div>`});let t=tbl().sort((a,b)=>b.pts-a.pts);tb.innerHTML='';t.forEach((r,i)=>{tb.innerHTML+=`<tr style="${i==0&&r.pts>0?'background:rgba(192,192,192,.18);border-left:3px solid #c0c0c0':''}"><td>${i+1}</td><td>${i==0&&r.pts>0?'👑 ':''}${r.t}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td style="font-weight:900;background:#1a1e2b;border-radius:6px">${r.pts}</td></tr>`});if(t[0]&&t[0].pts>0)document.getElementById('champ').textContent='👑 '+t[0].t+' - '+t[0].pts+' PTS';else document.getElementById('champ').textContent='Season Ongoing';}
let admin=false;function openA(){if(admin){document.getElementById('ap').classList.remove('hidden');return}document.getElementById('log').classList.add('s')}function closeA(){document.getElementById('log').classList.remove('s')}function login(){if(atob('SmFwaGV0aEAyMDI2')==document.getElementById('pw').value.trim()){admin=true;closeA();document.getElementById('ap').classList.remove('hidden');document.getElementById('st').textContent='ADMIN';}else alert('Wrong password')}
function initSel(){let rA=document.getElementById('rA'),rB=document.getElementById('rB');T.forEach(t=>{rA.innerHTML+=`<option>${t}</option>`;rB.innerHTML+=`<option>${t}</option>`});rB.selectedIndex=1}
initSel();loadR();setInterval(loadR,10000);
</script></body></html>
